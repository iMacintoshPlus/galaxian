name: Update AltStore source
on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
concurrency:
  group: altstore-source
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - name: Read published releases and inspect their IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ios/update_altstore.py
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/altstore.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update AltStore source from published releases'
          git pull --rebase origin master
          git push origin HEAD:master
