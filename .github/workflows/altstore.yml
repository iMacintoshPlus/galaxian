name: Send published IPA to AltStore source
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published iOS release tag to send to the shared source
        required: true
        type: string
concurrency:
  group: altstore-notify
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: iMacintoshPlus/altstore-source
          ref: main
          path: altstore-source
          ssh-key: ${{ secrets.ALTSTORE_SOURCE_DEPLOY_KEY }}
      - name: Notify shared source of approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 ios/notify_altstore.py
